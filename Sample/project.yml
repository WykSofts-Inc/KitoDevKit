name: KitoSample
options:
  bundleIdPrefix: com.wyksoftsinc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KitoCore: { path: ../../KitoCore }
  KitoButtons: { path: ../../KitoButtons }
  KitoCharts: { path: ../../KitoCharts }
  KitoLoaders: { path: ../../KitoLoaders }
  KitoToasts: { path: ../../KitoToasts }
  KitoModals: { path: ../../KitoModals }
  KitoEmptyStates: { path: ../../KitoEmptyStates }
  KitoHaptics: { path: ../../KitoHaptics }
  KitoValidation: { path: ../../KitoValidation }
  KitoNavigation: { path: ../../KitoNavigation }
  KitoPermissions: { path: ../../KitoPermissions }
  KitoBiometrics: { path: ../../KitoBiometrics }
  KitoMediaPicker: { path: ../../KitoMediaPicker }
  KitoOnboarding: { path: ../../KitoOnboarding }
  KitoCart: { path: ../../KitoCart }
  KitoOrderTracking: { path: ../../KitoOrderTracking }
  KitoFormatting: { path: ../../KitoFormatting }
  KitoConnectivity: { path: ../../KitoConnectivity }
  KitoKeychain: { path: ../../KitoKeychain }
targets:
  KitoSample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KitoDevKit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "KitoSample demos KitoMediaPicker's camera source."
        NSPhotoLibraryAddUsageDescription: "KitoSample demos saving images to Photos via KitoMediaPicker."
        NSFaceIDUsageDescription: "KitoSample demos KitoBiometrics."
        NSPhotoLibraryUsageDescription: "KitoSample demos KitoPermissions' Photo Library request."
        NSMicrophoneUsageDescription: "KitoSample demos KitoPermissions' Microphone request."
        NSLocationWhenInUseUsageDescription: "KitoSample demos KitoPermissions' Location request."
        NSLocationAlwaysAndWhenInUseUsageDescription: "KitoSample demos KitoPermissions' Location Always request."
        NSContactsUsageDescription: "KitoSample demos KitoPermissions' Contacts request."
        NSCalendarsFullAccessUsageDescription: "KitoSample demos KitoPermissions' Calendar request."
        NSRemindersFullAccessUsageDescription: "KitoSample demos KitoPermissions' Reminders request."
        NSSpeechRecognitionUsageDescription: "KitoSample demos KitoPermissions' Speech Recognition request."
        NSAppleMusicUsageDescription: "KitoSample demos KitoPermissions' Media Library request."
        NSBluetoothAlwaysUsageDescription: "KitoSample demos KitoPermissions' Bluetooth request."
        NSUserTrackingUsageDescription: "KitoSample demos KitoPermissions' App Tracking request."
        # Required for the app to be able to start a Live Activity at all —
        # without this key, Activity.request() throws, silently, every time.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyksoftsinc.kitosample
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KitoCore
      - package: KitoButtons
      - package: KitoCharts
      - package: KitoLoaders
      - package: KitoToasts
      - package: KitoModals
      - package: KitoEmptyStates
      - package: KitoHaptics
      - package: KitoValidation
      - package: KitoNavigation
      - package: KitoPermissions
      - package: KitoBiometrics
      - package: KitoMediaPicker
      - package: KitoOnboarding
      - package: KitoCart
      - package: KitoOrderTracking
      - package: KitoFormatting
      - package: KitoConnectivity
      - package: KitoKeychain
      - target: OrderTrackingWidgetExtension
        embed: true

  OrderTrackingWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension/Sources
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: OrderTrackingWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyksoftsinc.kitosample.OrderTrackingWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    dependencies:
      - package: KitoOrderTracking
      - package: KitoCore
