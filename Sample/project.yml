name: KitoSample
options:
  bundleIdPrefix: com.wyksoftsinc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KitoCore: { path: ../../KitoCore }
  # Published releases, not the local copies in this folder: the local KitoButtons is 1.6.0,
  # two releases behind, and KitoScreens itself pulls these from GitHub — mixing a local copy
  # with the published one is a package-identity clash.
  KitoButtons: { url: https://github.com/wykeenjenga/KitoButtons, from: 1.8.0 }
  KitoFields: { url: https://github.com/wykeenjenga/KitoFields, from: 1.9.2 }
  KitoScreens: { url: https://github.com/wykeenjenga/KitoScreens, from: 0.3.0 }
  KitoCharts: { path: ../../KitoCharts }
  KitoLoaders: { path: ../../KitoLoaders }
  KitoToasts: { path: ../../KitoToasts }
  KitoModals: { path: ../../KitoModals }
  KitoEmptyStates: { path: ../../KitoEmptyStates }
  KitoHaptics: { path: ../../KitoHaptics }
  KitoValidation: { path: ../../KitoValidation }
  KitoNavigation: { path: ../../KitoNavigation }
  KitoPermissions: { path: ../../KitoPermissions }
  KitoBiometrics: { path: ../../KitoBiometrics }
  KitoMediaPicker: { path: ../../KitoMediaPicker }
  KitoWalletCards: { path: ../../KitoWalletCards }
  KitoOnboarding: { path: ../../KitoOnboarding }
  KitoCart: { path: ../../KitoCart }
  KitoOrderTracking: { path: ../../KitoOrderTracking }
  KitoFormatting: { path: ../../KitoFormatting }
  KitoConnectivity: { path: ../../KitoConnectivity }
  KitoKeychain: { path: ../../KitoKeychain }
  KitoImageLoader: { path: ../../KitoImageLoader }
  KitoIslandBar: { path: ../../KitoIslandBar }
  KitoPhotoEditor: { url: https://github.com/WykSofts-Inc/KitoPhotoEditor, from: 0.1.1 }
  KitoChat: { path: ../../KitoChat }
  KitoCalendar: { path: ../../KitoCalendar }
  KitoMediaPlayer: { path: ../../KitoMediaPlayer }
  KitoPaywall: { path: ../../KitoPaywall }
  KitoAuth: { path: ../../KitoAuth }
  KitoMaps: { path: ../../KitoMaps }
  KitoMapsGoogle: { path: ../../KitoMapsGoogle }
  KitoMapsLibre: { path: ../../KitoMapsLibre }
  KitoCarousel: { path: ../../KitoCarousel }
  KitoReviews: { path: ../../KitoReviews }
  KitoWidgets: { path: ../../KitoWidgets }
  KitoNotifications: { path: ../../KitoNotifications }
  KitoSearch: { path: ../../KitoSearch }
  KitoAIChat: { path: ../../KitoAIChat }
  KitoScanner: { path: ../../KitoScanner }
  KitoTour: { path: ../../KitoTour }
  KitoProduct: { path: ../../KitoProduct }
  KitoCheckout: { path: ../../KitoCheckout }
  KitoFeed: { path: ../../KitoFeed }
  KitoSettings: { path: ../../KitoSettings }
  KitoSignature: { path: ../../KitoSignature }
  KitoFileViewer: { path: ../../KitoFileViewer }
targets:
  KitoSample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KitoDevKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Take photos to try the camera, photo editor and media picker samples."
        NSPhotoLibraryAddUsageDescription: "Save photos you edit in the samples to your library."
        NSFaceIDUsageDescription: "Use Face ID to try the app-lock, secure notes and sign-in samples."
        NSPhotoLibraryUsageDescription: "Choose photos to try the media picker, photo editor and review samples."
        NSMicrophoneUsageDescription: "Record voice notes in the chat sample and try the microphone permission sample."
        NSLocationWhenInUseUsageDescription: "Show where you are on the map samples and try the location permission sample."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Try the background location permission sample. Your location never leaves your device."
        NSContactsUsageDescription: "Try the contacts permission sample. Nothing is uploaded or stored."
        NSCalendarsFullAccessUsageDescription: "Try the calendar permission sample. Nothing is uploaded or stored."
        NSRemindersFullAccessUsageDescription: "Try the reminders permission sample. Nothing is uploaded or stored."
        NSSpeechRecognitionUsageDescription: "Try the speech recognition permission sample."
        NSAppleMusicUsageDescription: "Try the media library permission sample."
        NSBluetoothAlwaysUsageDescription: "Try the Bluetooth permission sample."
        # Required for the app to be able to start a Live Activity at all —
        # without this key, Activity.request() throws, silently, every time.
        NSSupportsLiveActivities: true
        # Keep audio and Picture in Picture going when the app is in the background (KitoMediaPlayer).
        UIBackgroundModes: [audio]
        # The App Group the app and its widgets share data through (KitoWidgets).
        KitoWidgetsAppGroup: group.com.wyksoftsinc.kitosample
        # Paste a Google Maps API key here to see live Google tiles (KitoMapsGoogle); empty shows setup help.
        GMSApiKey: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.wyksoftsinc.kitosample
            CFBundleURLSchemes: [kitosample]
    entitlements:
      path: KitoSample.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wyksoftsinc.kitosample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyksoftsinc.kitosample
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KitoCore
      - package: KitoButtons
      - package: KitoFields
      - package: KitoScreens
      - package: KitoCharts
      - package: KitoLoaders
      - package: KitoToasts
      - package: KitoModals
      - package: KitoEmptyStates
      - package: KitoHaptics
      - package: KitoValidation
      - package: KitoNavigation
      - package: KitoPermissions
      - package: KitoBiometrics
      - package: KitoMediaPicker
      - package: KitoWalletCards
      - package: KitoOnboarding
      - package: KitoCart
      - package: KitoOrderTracking
      - package: KitoFormatting
      - package: KitoConnectivity
      - package: KitoKeychain
      - package: KitoImageLoader
      - package: KitoIslandBar
      - package: KitoPhotoEditor
      - package: KitoChat
      - package: KitoCalendar
      - package: KitoMediaPlayer
      - package: KitoPaywall
      - package: KitoAuth
      - package: KitoMaps
      - package: KitoMapsGoogle
      - package: KitoMapsLibre
      - package: KitoCarousel
      - package: KitoReviews
      - package: KitoWidgets
      - package: KitoNotifications
      - package: KitoSearch
      - package: KitoAIChat
      - package: KitoScanner
      - package: KitoTour
      - package: KitoProduct
      - package: KitoCheckout
      - package: KitoFeed
      - package: KitoSettings
      - package: KitoSignature
      - package: KitoFileViewer
      - target: OrderTrackingWidgetExtension
        embed: true

  OrderTrackingWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension/Sources
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: OrderTrackingWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        KitoWidgetsAppGroup: group.com.wyksoftsinc.kitosample
    entitlements:
      path: WidgetExtension/OrderTrackingWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wyksoftsinc.kitosample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyksoftsinc.kitosample.OrderTrackingWidget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    dependencies:
      - package: KitoOrderTracking
      - package: KitoCore
      - package: KitoWidgets

schemes:
  KitoSample:
    build:
      targets:
        KitoSample: all
    run:
      config: Debug
      # Local StoreKit products so the Paywall samples can buy and restore in the simulator.
      storeKitConfiguration: KitoSample.storekit
